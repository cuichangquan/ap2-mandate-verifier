name: "Issue73 six-case preparation — STATIC ONLY / DISABLED"
# Source/offline mock tests only. No merge or dispatch approval.
# No push/PR/schedule trigger, token, checkout, package acquisition or tag claim.
on:
  workflow_dispatch:
permissions: {}
jobs:
  static-hold:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: "Static design ceilings are not execution authorization"
        shell: bash
        run: |
          echo 'STATIC_ONLY / INPUT_INVENTORY_INCOMPLETE / EXECUTION_HOLD'
          exit 78
