name: P1-6 Security Hardening Research (all RED must clear)

on:
  pull_request:
    paths:
      - 'research/shared/**'
      - 'research/p1_1/**'
      - 'research/p1_2/**'
      - 'research/p1_3/**'
      - 'research/p1_5/**'
      - '.github/workflows/p1-6-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Checkout pinned AP2 official Python SDK
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/google-agentic-commerce/AP2.git "$RUNNER_TEMP/ap2"
          git -C "$RUNNER_TEMP/ap2" checkout --detach b4587ac1d055888a73b4b21750973cffba961793
          test "$(git -C "$RUNNER_TEMP/ap2" rev-parse HEAD)" = "b4587ac1d055888a73b4b21750973cffba961793"
      - name: Install upstream Python direct dependency pins
        shell: bash
        working-directory: ${{ runner.temp }}/ap2
        run: |
          # Private index in upstream uv.lock requires credentials.
          # This reproduces pyproject direct pins, not the entire uv.lock.
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple -e .
          python -m pip freeze > "$GITHUB_WORKSPACE/p1-6-python-packages.txt"
      - name: Create issuer agent merchant signed research vectors
        shell: bash
        run: |
          python research/p1_5/generate_signed_negatives.py "$RUNNER_TEMP/p1-5-signed.json"
          python research/p1_3/generate_merchant_checkout.py "$RUNNER_TEMP/p1-3-signed.json"
          python research/p1_2/generate_two_hop_python.py "$RUNNER_TEMP/p1-2-signed.json"
          python research/p1_1/generate_python_sdjwt.py "$RUNNER_TEMP/p1-1-signed.json"
      - name: Install JWT Ruby and syntax-check all modified code
        shell: bash
        run: |
          gem install jwt -v 3.3.0 --no-document
          ruby -v
          ruby -rjwt -e 'puts "JWT #{Gem.loaded_specs.fetch("jwt").version}"'
          ruby -c research/shared/strict_json_research.rb
          ruby -c research/p1_1/root_sdjwt_research.rb
          ruby -c research/p1_2/two_hop_research.rb
          ruby -c research/p1_3/checkout_binding_research.rb
      - name: Regression P1-1 Root and disclosures
        shell: bash
        env:
          AP2_P11_FIXTURES: ${{ runner.temp }}/p1-1-signed.json
        run: |
          set -o pipefail
          ruby research/p1_1/test_ruby_root_sdjwt.rb --verbose 2>&1 | tee p1-6-regression-p1-1.log
      - name: Regression P1-2 Agent two-hop binding
        shell: bash
        env:
          AP2_P12_FIXTURES: ${{ runner.temp }}/p1-2-signed.json
        run: |
          set -o pipefail
          ruby research/p1_2/test_ruby_two_hop.rb --verbose 2>&1 | tee p1-6-regression-p1-2.log
      - name: Regression P1-3 Merchant Checkout binding
        shell: bash
        env:
          AP2_P13_FIXTURES: ${{ runner.temp }}/p1-3-signed.json
        run: |
          set -o pipefail
          ruby research/p1_3/test_checkout_binding.rb --verbose 2>&1 | tee p1-6-regression-p1-3.log
      - name: SECURITY GATE signed negatives MUST NOT have RED or ERROR
        shell: bash
        env:
          AP2_P15_FIXTURES: ${{ runner.temp }}/p1-5-signed.json
          AP2_P15_RESULTS: p1-6-security-observations.json
        run: |
          set -o pipefail
          ruby research/p1_5/observe_security_negatives.rb 2>&1 | tee p1-6-security-observations.log
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("p1-6-security-observations.json").read_text())
          summary = report["summary"]
          print("P1-6 evidence:", summary)
          assert report["case_count"] == 18
          assert summary["RED"] == 0, "Signed hostile input unexpectedly accepted"
          assert summary["ERROR"] == 0, "Unhandled observer errors"
          assert summary["GREEN"] == 17, "Expected one control and 16 negative checks"
          assert summary["HOST_BOUNDARY"] == 1, "Host replay boundary must remain visible"
          PY
      - name: Upload measured regression and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-6-security-hardening-evidence
          path: |
            p1-6-regression-p1-1.log
            p1-6-regression-p1-2.log
            p1-6-regression-p1-3.log
            p1-6-security-observations.json
            p1-6-security-observations.log
            p1-6-python-packages.txt
          retention-days: 7
          if-no-files-found: warn
