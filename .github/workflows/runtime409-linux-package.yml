name: LINUX409 actual Gem package (manual only; execution requires approval)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact independently reviewed and merged main commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: runtime409-linux-package-one-approved-run
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'cuichangquan/ap2-mandate-verifier' && !github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate dispatch identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Validate checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify and expand the one official Ruby provider archive
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_TOOL_CACHE" = /opt/hostedtoolcache
          prefix="$RUNNER_TOOL_CACHE/Ruby/4.0.9/x64"
          test ! -e "$prefix" # Never replace an existing/unknown toolcache provider.
          mkdir "$RUNNER_TEMP/ap2-linux409-ruby"
          archive="$RUNNER_TEMP/ap2-linux409-ruby/provider.tar.gz"
          curl --fail --silent --show-error --http1.1 --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --location --max-redirs 2 --connect-timeout 15 --max-time 120 --retry 0 \
            --max-filesize 49100121 --dump-header "$RUNNER_TEMP/ap2-linux409-ruby/headers" \
            --output "$archive" --write-out 'ruby body=%{size_download} sent_headers=%{size_request} received_headers=%{size_header}\n' \
            https://github.com/ruby/ruby-builder/releases/download/ruby-4.0.9/ruby-4.0.9-ubuntu-24.04-x64.tar.gz
          test "$(wc -c < "$archive")" -eq 49100121
          echo "046d1422e1be5575eadd55323c85c3efbeaee8c8e1c1bfccee343e28619cb3b3  $archive" | sha256sum --check --status
          # Official builder uses tar -C dirname(PREFIX) basename(PREFIX), i.e. x64/.
          mkdir -p "$(dirname "$prefix")"
          tar -xzf "$archive" -C "$(dirname "$prefix")"
          test -x "$prefix/bin/ruby"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Identify actual Ubuntu OpenSSL provider before Gem acquisition
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          echo "737e35144429511159fbd5058dad494ad529e11d8026773e5d08927c8c181592  research/runtime409_linux_package/verify_package.rb" | sha256sum --check --status
          echo "62fdc4b4e0e889bae9cd6881e4cfbce59fa76b361c863970dd8f43e9f726cec7  research/runtime409_linux_package/CURRENT_MANIFEST.json" | sha256sum --check --status
          timeout 45 ruby research/runtime409_linux_package/verify_package.rb --provider-preflight
      - name: Fixed three archives only (requires separate execution approval)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          default_gems=$(ruby -e 'print Gem.default_dir')
          export GEM_HOME="$RUNNER_TEMP/ap2-linux409-deps"
          export GEM_PATH="$GEM_HOME:$default_gems"
          mkdir "$GEM_HOME" "$RUNNER_TEMP/ap2-linux409-archives"
          cd "$RUNNER_TEMP/ap2-linux409-archives"
          # Exactly176640B of bodies; setup-ruby/checkout/runner traffic is not measured here.
          while read -r name bytes sha; do
            curl --fail --silent --show-error --http1.1 --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 45 --retry 0 --max-filesize "$bytes" \
              --dump-header "$name.headers" --output "$name.gem" \
              --write-out "$name body=%{size_download} sent_headers=%{size_request} received_headers=%{size_header}\n" \
              "https://rubygems.org/gems/$name.gem"
            test "$(wc -c < "$name.gem")" -eq "$bytes"
            echo "$sha  $name.gem" | sha256sum --check --status
          done <<'GEMS'
          json-2.19.9 107008 9b9025b7cdddafa38d316eca0b2358488e42d417045c1b90d216a9fefe46b79a
          jwt-3.3.0 57856 44cc34fbc341c148233cf66641522b4bce0dfb1ce55e8073f05c56f44f4ee546
          base64-0.3.0 11776 27337aeabad6ffae05c265c450490628ef3ebd4b67be58257393227588f5a97b
          GEMS
          # One native JSON build at most,180s, no retry; other two are pure Ruby.
          timeout 180 gem install --norc --local json-2.19.9.gem --ignore-dependencies --no-document
          timeout 30 gem install --norc --local jwt-3.3.0.gem --ignore-dependencies --no-document
          timeout 30 gem install --norc --local base64-0.3.0.gem --ignore-dependencies --no-document
          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "GEM_PATH=$GEM_PATH" >> "$GITHUB_ENV"
      - name: Actual package,885 source regressions and52 installed checks
        timeout-minutes: 11
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          timeout 630 ruby research/runtime409_linux_package/verify_package.rb 62fdc4b4e0e889bae9cd6881e4cfbce59fa76b361c863970dd8f43e9f726cec7
