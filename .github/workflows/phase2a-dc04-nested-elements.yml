name: Phase 2-A DC04 Signed Nested Element Probe (research gate MAY BE RED)

on:
  pull_request:
    paths:
      - "research/phase2a_dc04/**"
      - "research/phase2a_dc01/**"
      - "research/p1_1/**"
      - "research/p1_2/**"
      - "research/p1_3/**"
      - "research/shared/**"
      - ".github/workflows/phase2a-dc04-nested-elements.yml"
      - "docs/PHASE2A_DC04_OBSERVATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dc04-gate-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout research read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Checkout exact official AP2 commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/google-agentic-commerce/AP2.git "$RUNNER_TEMP/ap2"
          git -C "$RUNNER_TEMP/ap2" checkout --detach b4587ac1d055888a73b4b21750973cffba961793
          test "$(git -C "$RUNNER_TEMP/ap2" rev-parse HEAD)" = "b4587ac1d055888a73b4b21750973cffba961793"
      - name: Install official direct dependencies and independent schema reader
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple -e "$RUNNER_TEMP/ap2"
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple jsonschema==4.26.0
          gem install jwt -v 3.3.0 --no-document
          python -m pip freeze > "$RUNNER_TEMP/dc04-python-freeze.txt"
          ruby -rjwt -e 'abort "wrong JWT" unless Gem.loaded_specs.fetch("jwt").version.to_s == "3.3.0"'
      - name: O1-O4 generate and validate genuinely signed nested Merchant and SKU element negatives
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -B research/phase2a_dc04/generate_and_observe.py \
            --fixture "$RUNNER_TEMP/dc04-fixture.json" \
            --schema "$RUNNER_TEMP/ap2/code/sdk/schemas/ap2/open_checkout_mandate.json" \
            --merchant-schema "$RUNNER_TEMP/ap2/code/sdk/schemas/ap2/types/merchant.json" \
            --replay-dir "$RUNNER_TEMP/dc04-replay"
      - name: O5 diagnose legacy Ruby positive precondition and both negatives
        shell: bash
        env:
          AP2_DC04_FIXTURE: ${{ runner.temp }}/dc04-fixture.json
          AP2_DC04_RUBY_REPORT: ${{ runner.temp }}/dc04-replay/ruby-observation.json
        run: |
          set -euo pipefail
          ruby -c research/phase2a_dc04/observe_legacy_ruby.rb
          ruby research/phase2a_dc04/observe_legacy_ruby.rb
          cp "$RUNNER_TEMP/dc04-python-freeze.txt" "$RUNNER_TEMP/dc04-replay/python-freeze.txt"
          git -C "$RUNNER_TEMP/ap2" rev-parse HEAD > "$RUNNER_TEMP/dc04-replay/upstream-sha.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/dc04-replay/research-head-sha.txt"
      - name: O6 evaluate isolated fixed-Issuer Ruby candidate without relaxing legacy
        shell: bash
        env:
          AP2_DC04_FIXTURE: ${{ runner.temp }}/dc04-fixture.json
          AP2_DC04_FIXED_RUBY_REPORT: ${{ runner.temp }}/dc04-replay/fixed-ruby-observation.json
        run: |
          set -euo pipefail
          ruby -c research/phase2a_dc04/fixed_issuer_verifier.rb
          ruby -c research/phase2a_dc04/observe_fixed_ruby.rb
          ruby -c research/p1_2/two_hop_research.rb
          ruby -c research/p1_3/checkout_binding_research.rb
          ruby research/phase2a_dc04/observe_fixed_ruby.rb
      - name: Verify evidence and report DC04 security gate distinct from CI harness
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/dc04-replay" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          py = json.loads((p / "python-observation.json").read_text())
          ruby = json.loads((p / "ruby-observation.json").read_text())
          assert py["case_id"] == ruby["case_id"] == "DC04"
          assert py["pinned_ap2_sha"] == "b4587ac1d055888a73b4b21750973cffba961793"
          assert (p / "upstream-sha.txt").read_text().strip() == py["pinned_ap2_sha"]
          assert py["o1_o2"] == "ALL_THREE_VARIANTS_CRYPTO_VALID_AND_UPSTREAM_CHAIN_VALID"
          assert py["o3_full_signed_commitments"] == 3
          assert py["o3_full_unresolved"] == 0 and py["o3_hidden_unresolved_each"] == 1
          assert py["conclusion_before_o5"] == "O1_O4_ONLY_NOT_A_DC04_SECURITY_PASS"
          paths = set(py["o3_commitment_paths"])
          assert paths == {
              "$/delegate_payload/0",
              "$/delegate_payload/0/disclosed/constraints/1/allowed/0",
              "$/delegate_payload/0/disclosed/constraints/0/items/0/acceptable_items/0",
          }
          for k in ["hidden_merchant_element", "hidden_sku_element"]:
              assert py["o4_o3_variants"][k]["issuer_agent_merchant_crypto"] == "VALID"
              assert py["o4_o3_variants"][k]["raw_wire_reason"] == \
                  "incomplete_disclosure: signed commitment not disclosed"
          assert py["o4_o3_variants"]["full"]["official_open_schema"] == "VALID"
          candidate = json.loads((p / "fixed-ruby-observation.json").read_text())
          assert candidate["case_id"] == "DC04"
          assert candidate["profile"] == "dc04-v1-exact-three-array-commitments"
          assert candidate["pinned_ap2_sha"] == py["pinned_ap2_sha"]
          assert candidate["candidate_full"]["status"] == "LIMITED_POSITIVE"
          assert all(candidate["candidate_hidden"][k]["status"] == "REJECT" and
                     candidate["candidate_hidden"][k]["reason"] ==
                     "incomplete_disclosure: missing disclosure"
                     for k in ["hidden_merchant_element", "hidden_sku_element"])
          assert set(candidate["candidate_signed_layout_negatives"]) == {
              "unexpected_nested_path", "issuer_decoy",
          }
          assert all(item["status"] == "REJECT"
                     for item in candidate["candidate_signed_layout_negatives"].values())
          assert set(py["additional_genuine_signed_negatives"]) == {
              "unexpected_nested_path", "issuer_decoy",
          }
          assert candidate["candidate_gate"] == "LIMITED_DC04_OBSERVED"
          control = ruby["legacy_ruby_observations"]["full"]
          approved = control["status"] == "LIMITED_POSITIVE" and all(
              ruby["legacy_ruby_observations"][k]["reason"] == "missing disclosure"
              for k in ["hidden_merchant_element", "hidden_sku_element"]
          )
          expected_gate = "LIMITED_DC04_OBSERVED" if approved else "RED_HOLD"
          assert ruby["dc04_gate"] == expected_gate
          assert ruby["positive_precondition_met"] == (control["status"] == "LIMITED_POSITIVE")
          assert (p / "full-root-jws.txt").read_bytes() == \
                 (p / "hidden_merchant_element-root-jws.txt").read_bytes() == \
                 (p / "hidden_sku_element-root-jws.txt").read_bytes()
          expected = {"full-root-sdjwt.txt", "hidden_merchant_element-root-sdjwt.txt",
                      "hidden_sku_element-root-sdjwt.txt",
                      "full-terminal-sdjwt.txt", "hidden_merchant_element-terminal-sdjwt.txt",
                      "hidden_sku_element-terminal-sdjwt.txt", "merchant-jwt.txt",
                      "python-observation.json", "ruby-observation.json",
                      "fixed-ruby-observation.json",
                      "issuer_decoy-root-sdjwt.txt", "issuer_decoy-terminal-sdjwt.txt",
                      "unexpected_nested_path-root-sdjwt.txt", "unexpected_nested_path-terminal-sdjwt.txt",
                      "public-fixture.json", "python-freeze.txt",
                      "upstream-sha.txt", "research-head-sha.txt"}
          assert expected <= {q.name for q in p.iterdir() if q.is_file()}
          entries = []
          for file in sorted(p.iterdir()):
              if file.is_file() and file.name != "evidence-manifest.json":
                  data = file.read_bytes()
                  entries.append({"path": file.name, "sha256": hashlib.sha256(data).hexdigest(),
                                  "byte_length": len(data)})
          (p / "evidence-manifest.json").write_text(
              json.dumps({"case_id": "DC04", "legacy_gate": expected_gate,
                          "fixed_issuer_candidate_gate": candidate["candidate_gate"],
                          "files": entries}, sort_keys=True, indent=2) + "\n")
          for e in json.loads((p / "evidence-manifest.json").read_text())["files"]:
              data = (p / e["path"]).read_bytes()
              assert hashlib.sha256(data).hexdigest() == e["sha256"]
              assert len(data) == e["byte_length"]
          print("DC04 O1–O4 issued and independently checked real synthetic signatures")
          print("DC04 LEGACY SECURITY GATE:", expected_gate)
          print("DC04 FIXED-ISSUER CANDIDATE GATE:", candidate["candidate_gate"])
          print("HOLD: independent latest-HEAD review and parent Issue #47 are not complete")
          if expected_gate == "RED_HOLD":
              print("WARNING: CI probe success does NOT mean DC04 gate passed")
          PY
      - name: Upload only synthetic public-key signed wires and observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-dc04-nested-element-signed-probe
          path: ${{ runner.temp }}/dc04-replay/
          retention-days: 7
          if-no-files-found: warn
