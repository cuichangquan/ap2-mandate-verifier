name: Merchant source and package
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'scripts/check_ruby_compatibility.sh'
      - 'scripts/check_runtime.rb'
      - 'scripts/check_candidate_package.sh'
      - 'ap2_mandate_verifier.gemspec'
      - 'README.md'
      - 'README.ja.md'
      - 'examples/merchant_signing.rb'
      - 'examples/selective_checkout.rb'
      - 'examples/selective_checkout_payment.rb'
      - 'examples/payment_policy.rb'
      - 'examples/payment_acceptance.rb'
      - 'examples/ruby_integration.rb'
      - 'examples/integration/**'
      - 'docs/RUBY_INTEGRATION.md'
      - 'docs/RUBY_INTEGRATION.ja.md'
      - 'examples/recurring_payment.rb'
      - 'examples/long_payment.rb'
      - 'examples/long_payment_acceptance.rb'
      - 'docs/LONG_PAYMENT.md'
      - 'docs/RECURRING_PAYMENT.md'
      - 'docs/PAYMENT_ACCEPTANCE.md'
      - 'docs/PAYMENT_POLICY.md'
      - 'docs/SELECTIVE_CHECKOUT.md'
      - 'scripts/check_published_guides.rb'
      - 'scripts/check_sdk_platform.rb'
      - 'scripts/check_native_published.rb'
      - '.github/native-gems.sha256'
      - 'docs/PLATFORM_SUPPORT.md'
      - 'docs/QUICK_START.md'
      - 'docs/QUICK_START.ja.md'
      - '.github/published-guides.Dockerfile'
      - 'docs/MERCHANT_SIGNING.md'
      - 'docs/SUPPORT_CONTRACT.md'
      - '.github/merchant-ci.Dockerfile'
      - '.github/workflows/merchant-source-package.yml'
permissions:
  contents: read
concurrency:
  group: merchant-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-package:
    if: github.repository == 'cuichangquan/ap2-mandate-verifier' && !github.event.repository.private
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4.12', '4.0.9']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            machine: x86_64
            docker_arch: amd64
          - runner: ubuntu-24.04-arm
            machine: aarch64
            docker_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require native runner and Docker architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.machine }}'
          case "$(docker info --format '{{.Architecture}}')" in
            '${{ matrix.machine }}'|'${{ matrix.docker_arch }}') ;;
            *) echo 'STOP: unexpected Docker server architecture'; exit 1 ;;
          esac
          echo "Native Linux runner=${{ matrix.runner }} machine=$(uname -m) Ruby=${{ matrix.ruby }}"
      - name: Identify product changes without rebuilding published documentation
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
          if grep -Eq '^(examples/ruby_integration\.rb$|examples/integration/|examples/long_payment(_acceptance)?\.rb$|examples/recurring_payment\.rb$|examples/payment_acceptance\.rb$|examples/payment_policy\.rb$|examples/selective_checkout(_payment)?\.rb$|lib/|test/|ap2_mandate_verifier\.gemspec$|scripts/check_ruby_compatibility\.sh$|scripts/check_runtime\.rb$|scripts/check_candidate_package\.sh$|scripts/check_sdk_platform\.rb$|\.github/workflows/merchant-source-package\.yml$|\.github/merchant-ci\.Dockerfile$)' "$RUNNER_TEMP/changed-paths"; then
            echo 'product=true' >> "$GITHUB_OUTPUT"
          else
            echo 'product=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build isolated pinned Ruby dependencies
        if: steps.scope.outputs.product == 'true'
        run: docker build --platform linux/${{ matrix.docker_arch }} --build-arg RUBY_VERSION=${{ matrix.ruby }} -t ap2-merchant-ci -f .github/merchant-ci.Dockerfile .github
      - name: Source regression and ordinary candidate installation
        if: steps.scope.outputs.product == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/merchant-evidence"
          docker run --rm --network=none --cpus=2 --memory=768m --pids-limit=128 \
            -e EXPECTED_MACHINE=${{ matrix.machine }} -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/merchant-evidence:/out" \
            ap2-merchant-ci sh -c '
              set -eu
              test "$(uname -m)" = "$EXPECTED_MACHINE"
              timeout 300 sh scripts/check_ruby_compatibility.sh /out/source
              gem build ap2_mandate_verifier.gemspec --output /out/candidate.gem
              timeout 300 sh scripts/check_candidate_package.sh /out/package /out/candidate.gem
              cat /out/package/merchant-installed.json
            '
      - name: Verify published Gem guides without Gem build
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/${{ matrix.docker_arch }} --build-arg RUBY_VERSION=${{ matrix.ruby }} -t ap2-published-guides -f .github/published-guides.Dockerfile .github
          docker run --rm --network=none --cpus=2 --memory=768m --pids-limit=128 \
            -e EXPECTED_MACHINE=${{ matrix.machine }} -v "$GITHUB_WORKSPACE:/src:ro" ap2-published-guides \
            sh -c 'set -eu
              test "$(uname -m)" = "$EXPECTED_MACHINE"
              timeout 30 ruby scripts/check_runtime.rb
              timeout 30 ruby scripts/check_sdk_platform.rb /opt/ap2/published.gem
              timeout 120 ruby scripts/check_published_guides.rb
              AP2_INSTALLED=1 timeout 120 ruby test/ruby_integration_test.rb
            '

  native-published:
    if: github.repository == 'cuichangquan/ap2-mandate-verifier' && !github.event.repository.private
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4.12', '4.0.9']
        runner: [macos-15-intel, macos-15, windows-2022]
        include:
          - runner: macos-15-intel
            os: macos
            cpu: X64
            machine: x86_64
            sqlite: x86_64-darwin
          - runner: macos-15
            os: macos
            cpu: ARM64
            machine: arm64
            sqlite: arm64-darwin
          - runner: windows-2022
            os: windows
            cpu: X64
            sqlite: x64-mingw-ucrt
    env:
      AP2_NATIVE_OS: ${{ matrix.os }}
      AP2_NATIVE_CPU: ${{ matrix.cpu }}
      AP2_NATIVE_RUBY: ${{ matrix.ruby }}
      AP2_SQLITE_PLATFORM: ${{ matrix.sqlite }}
      AP2_INSTALLED: '1'
    steps:
      - name: Preserve published LF bytes in checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: Require native macOS hardware
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.machine }}'
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          sw_vers
          uname -a
      - name: Require native Windows X64 hardware
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'X64') { throw 'Native X64 Windows required' }
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # Node.js 24, exact MRI builds
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: none
      - name: Install hash-pinned published core outside checkout
        shell: bash
        run: |
          set -euo pipefail
          root="$(ruby -e 'puts File.join(ENV.fetch("RUNNER_TEMP"), "ap2-native").tr("\\", "/")')"
          mkdir -p "$root/gems" "$root/archives"
          export GEM_HOME="$root/gems" GEM_PATH="$root/gems"
          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "GEM_PATH=$GEM_PATH" >> "$GITHUB_ENV"
          echo "AP2_PUBLISHED_GEM=$root/archives/ap2_mandate_verifier-1.6.0.gem" >> "$GITHUB_ENV"
          for name in json-2.19.9 jwt-3.3.0 base64-0.3.0 openssl-4.0.2 digest-3.2.1 ap2_mandate_verifier-1.6.0; do
            file="$name.gem"
            curl --fail --silent --show-error --proto '=https' --max-time 60 --max-filesize 5242880 "https://rubygems.org/downloads/$file" -o "$root/archives/$file"
            ruby -rdigest -e 'expected = File.readlines(ARGV[0]).map(&:split).to_h.invert.fetch(File.basename(ARGV[1])); abort "Gem SHA mismatch" unless Digest::SHA256.file(ARGV[1]).hexdigest == expected' .github/native-gems.sha256 "$root/archives/$file"
            if [[ "$name" == openssl-* && "$RUNNER_OS" == macOS ]]; then
              gem install --local --no-document --ignore-dependencies "$root/archives/$file" -- --with-openssl-dir="$(brew --prefix openssl@3)"
            else
              gem install --local --no-document --ignore-dependencies "$root/archives/$file"
            fi
          done
      - name: Audit and exercise native published core without SQLite
        shell: bash
        run: ruby scripts/check_native_published.rb core
      - name: Install hash-pinned optional native SQLite driver
        shell: bash
        run: |
          set -euo pipefail
          file="sqlite3-2.10.2-${{ matrix.sqlite }}.gem"
          target="$(dirname "$AP2_PUBLISHED_GEM")/$file"
          curl --fail --silent --show-error --proto '=https' --max-time 60 --max-filesize 10485760 "https://rubygems.org/downloads/$file" -o "$target"
          ruby -rdigest -e 'expected = File.readlines(ARGV[0]).map(&:split).to_h.invert.fetch(File.basename(ARGV[1])); abort "SQLite SHA mismatch" unless Digest::SHA256.file(ARGV[1]).hexdigest == expected' .github/native-gems.sha256 "$target"
          gem install --local --no-document --ignore-dependencies "$target"
      - name: Exercise optional persistence and published bilingual guides
        shell: bash
        run: ruby scripts/check_native_published.rb persistence
