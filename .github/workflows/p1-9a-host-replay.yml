name: P1-9a/b/c Host Replay PostgreSQL 16 (research only)

on:
  pull_request:
    paths:
      - 'research/p1_9a/**'
      - 'research/p1_9b/**'
      - 'research/p1_9c/**'
      - '.github/workflows/p1-9a-host-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pg16-atomic-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres@sha256:ddfe3e8713e3ee5b8f286082cb12512488dfbf3f5a1ecb0b74a42e6055af0a5f
        env:
          POSTGRES_USER: labuser
          POSTGRES_PASSWORD: offline-test-only
          POSTGRES_DB: ap2_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labuser -d ap2_research"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      P19A_DATABASE_URL: postgresql://labuser:offline-test-only@127.0.0.1:5432/ap2_research
      P19A_REPORT: p19a-report.json
      P19B_REPORT: p19b-report.json
      P19C_REPORT: p19c-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Install narrow PostgreSQL client gem
        run: |
          gem install pg --version 1.5.9 --no-document
          ruby -rpg -e 'abort "Unexpected pg gem" unless Gem.loaded_specs.fetch("pg").version.to_s == "1.5.9"'
      - name: Record runner and DB version for evidence
        run: |
          {
            ruby -v
            ruby -rpg -e 'puts "pg gem #{Gem.loaded_specs.fetch("pg").version}"; puts "libpq #{PG.library_version}"'
            ruby -rpg -e 'db=PG.connect(ENV.fetch("P19A_DATABASE_URL")); puts "postgres #{db.exec("SHOW server_version").first.fetch("server_version")}"; db.close'
            docker image inspect postgres@sha256:ddfe3e8713e3ee5b8f286082cb12512488dfbf3f5a1ecb0b74a42e6055af0a5f --format 'postgres image ID={{.Id}} digests={{json .RepoDigests}}'
          } | tee p19a-environment.txt
      - name: Syntax check isolated research workers and tests
        run: |
          ruby -c research/p1_9a/worker.rb
          ruby -c research/p1_9a/test_host_replay_pg.rb
          ruby -c research/p1_9b/recovery_worker.rb
          ruby -c research/p1_9b/test_crash_recovery_pg.rb
          ruby -c research/p1_9c/timeout_worker.rb
          ruby -c research/p1_9c/fake_provider.rb
          ruby -c research/p1_9c/test_uncertainty_and_fake_provider_pg.rb
      - name: Run four isolated Host DB security experiments
        shell: bash
        run: |
          set -euo pipefail
          ruby research/p1_9a/test_host_replay_pg.rb --verbose 2>&1 | tee p19a-run.log
      - name: Reject incomplete or incorrect evidence
        if: success()
        run: |
          ruby -rjson -e '
            r=JSON.parse(File.read("p19a-report.json"))
            cases=r.fetch("executed_cases")
            abort "Expected exactly four cases" unless cases.map{|x| x.fetch("id")}.sort == %w[HR01 HR02 HR03 HR08]
            abort "All must PASS" unless cases.all?{|x| x.fetch("result") == "PASS"}
            abort "No actual PG blocking evidence" unless %w[HR01 HR02].all?{|id|
              cases.find{|x| x["id"] == id}.fetch("pg_lock_wait_observed") == true
            }
            abort "Unique constraint not verified" unless cases.find{|x| x["id"] == "HR02"}.fetch("unique_conflict_observed") == true
            abort "CAS 0-row not observed" unless cases.find{|x| x["id"] == "HR03"}.fetch("cas_zero_observed") == true
            abort "Replay not rejected" unless cases.find{|x| x["id"] == "HR08"}.fetch("replay_rejected") == true
            puts "PASS: four research-only Host DB scenarios; NO AP2/Payment/Receipt claim"
          '
      - name: Run HR04 HR05 actual process-crash research
        shell: bash
        run: |
          set -euo pipefail
          ruby research/p1_9b/test_crash_recovery_pg.rb --verbose 2>&1 | tee p19b-run.log
      - name: Reject incomplete crash/recovery evidence
        if: success()
        run: |
          ruby -rjson -e '
            cases=JSON.parse(File.read("p19b-report.json")).fetch("executed_cases")
            abort "Wrong HR04/HR05 set" unless cases.map{|x| x.fetch("id")}.sort == %w[HR04 HR05]
            abort "Incomplete or failed crash run" unless cases.all?{|x| x.fetch("result") == "PASS"}
            abort "No real SIGKILL/session closure" unless cases.all?{|x|
              x.fetch("actual_sigkill") == true && x.fetch("pg_session_closed") == true
            }
            before=cases.find{|x| x["id"] == "HR04"}
            after=cases.find{|x| x["id"] == "HR05"}
            abort "No rollback+revalidation evidence" unless
              before.fetch("pre_commit_rollback") == true &&
              before.fetch("recovery_before_retry") == "STOP" &&
              before.fetch("retry_after_fresh_check") == "COMMITTED"
            abort "No COMMIT/recovery idempotency proof" unless
              after.fetch("commit_ack_observed") == true &&
              after.fetch("stable_operation_recovered") == true &&
              after.fetch("stable_idempotency_key") == true &&
              after.fetch("no_second_operation") == true &&
              after.fetch("recovery_state") == "PENDING"
            puts "PASS: HR04/HR05 actual SIGKILL + rollback and read-only recovery; no payment claim"
          '
      - name: Run HR06 HR07 isolated uncertainty and mock Provider tests
        shell: bash
        run: |
          set -euo pipefail
          ruby research/p1_9c/test_uncertainty_and_fake_provider_pg.rb --verbose 2>&1 | tee p19c-run.log
      - name: Reject incomplete unknown-commit and fake-provider evidence
        if: success()
        run: |
          ruby -rjson -e '
            cases=JSON.parse(File.read("p19c-report.json")).fetch("executed_cases")
            abort "Wrong case IDs" unless cases.map{|x| x.fetch("id")}.sort == %w[HR06 HR07]
            abort "Missing/failed cases" unless cases.all?{|x| x.fetch("result") == "PASS"}
            a=cases.find{|x| x["id"] == "HR06"}
            b=cases.find{|x| x["id"] == "HR07"}
            abort "ACK uncertainty evidence missing" unless
              a.fetch("async_commit_sent_without_result") == true &&
              a.fetch("actual_sigkill") == true &&
              a.fetch("committed_operation_recovered") == true &&
              a.fetch("key_reused") == true &&
              a.fetch("replay_stopped") == true &&
              a.fetch("real_pg_timeout_sqlstate") == "55P03" &&
              a.fetch("blocked_wait_observed") == true &&
              a.fetch("no_new_operation_during_timeout") == true &&
              a.fetch("fake_provider_effects") == 0
            abort "Mock-provider idempotency evidence missing" unless
              b.fetch("response_lost_after_durable_effect") == true &&
              b.fetch("actual_sigkill") == true &&
              b.fetch("replay_stopped") == true &&
              b.fetch("stable_operation_and_key") == true &&
              b.fetch("mock_provider_requests") == 2 &&
              b.fetch("mock_logical_effects") == 1 &&
              b.fetch("mismatched_key_stopped") == true &&
              b.fetch("receipt_not_claimed") == true
            puts "PASS: HR06/07 constrained DB+mock scenarios; NO real network/payment claims"
          '
      - name: Upload time-limited, sanitized research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-9a-postgresql-evidence
          path: |
            p19a-report.json
            p19a-run.log
            p19a-environment.txt
            p19b-report.json
            p19b-run.log
            p19c-report.json
            p19c-run.log
          retention-days: 7
          if-no-files-found: warn
